name: OSS Atlas Dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: atlas-dashboard
  cancel-in-progress: true

jobs:
  dashboard:
    name: Generate dashboard cards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c
        with:
          python-version: "3.12"

      - name: Generate SVG cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_dashboard.py

      - name: Commit refreshed cards
        run: |
          if git diff --quiet -- assets/dashboard; then
            echo "Dashboard cards are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dashboard
          git commit -m "chore: refresh OSS Atlas dashboard"
          git push
