<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">OSS Atlas — Open-source engineering, mapped with evidence</title>
<desc id="desc">Editorial cover with warm paper background, oversized OSS Atlas typography, vermilion index mark, and a fine-line contribution map.</desc>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d9d3c8" stroke-width="0.8"/></pattern>
  <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f4ee"/><stop offset="1" stop-color="#eee8dc"/></linearGradient>
</defs>
<rect width="1200" height="480" fill="url(#wash)"/>
<rect width="1200" height="480" fill="url(#grid)" opacity=".45"/>
<path d="M0 22H1200" stroke="#171715" stroke-width="2"/>
<text x="64" y="64" fill="#171715" font-family="Arial,Helvetica,sans-serif" font-size="15" letter-spacing="4">FIELD NOTES / OPEN-SOURCE ENGINEERING</text>
<text x="1136" y="64" text-anchor="end" fill="#6e6a62" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="2">VOL. 01 — 2026</text>
<text x="58" y="258" fill="#171715" font-family="Arial,Helvetica,sans-serif" font-size="150" font-weight="800" letter-spacing="-10">OSS</text>
<text x="58" y="390" fill="#171715" font-family="Arial,Helvetica,sans-serif" font-size="150" font-weight="800" letter-spacing="-10">ATLAS<tspan fill="#f04424">.</tspan></text>
<path d="M720 120V410" stroke="#171715" stroke-width="1.5" opacity=".55"/>
<text x="770" y="160" fill="#f04424" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="3">AN ENGINEERING LEDGER</text>
<text x="770" y="215" fill="#171715" font-family="Georgia,serif" font-size="34">Work worth keeping.</text>
<text x="770" y="258" fill="#171715" font-family="Georgia,serif" font-size="34">Evidence worth checking.</text>
<text x="770" y="320" fill="#6e6a62" font-family="Arial,Helvetica,sans-serif" font-size="16">Contributions · Reviews · Research</text>
<text x="770" y="347" fill="#6e6a62" font-family="Arial,Helvetica,sans-serif" font-size="16">Case studies · Reusable learnings</text>
<g transform="translate(770 390)" fill="none" stroke="#f04424" stroke-width="2">
  <circle cx="8" cy="8" r="7"/><circle cx="78" cy="8" r="7"/><circle cx="148" cy="8" r="7"/>
  <path d="M15 8H71M85 8H141M155 8H230"/>
  <path d="M230 8l-9 -6m9 6l-9 6"/>
</g>
<text x="1136" y="448" text-anchor="end" fill="#6e6a62" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="2">OBSERVE → BUILD → VERIFY → RECORD</text>
</svg>